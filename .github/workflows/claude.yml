# Claude Code agent: starts when n8n (or you) adds the `agent-fix` label to an issue,
# or when the owner/a collaborator writes a comment that STARTS with @claude
# (a mention buried in other text, e.g. quoted from an issue, does not trigger it).
name: Claude agent
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Job-level concurrency: runs that skip themselves (comments without @claude) never take a slot.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent-fix') ||
      (github.event_name != 'issues' && startsWith(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          # Use ONE of these (repo Settings → Secrets → Actions):
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # from `claude setup-token` (Claude subscription)
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}             # or a pay-as-you-go API key
          label_trigger: agent-fix
          claude_args: |
            --max-turns 40
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue comment:*)"
